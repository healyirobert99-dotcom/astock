[project]
name = "a-stock-selector"
version = "0.1.0"
description = "Local A-share post-market selector and trading plan MVP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "akshare>=1.16.0",
    "altair>=5.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.36.0",
    "tushare>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
a-stock-selector = "a_stock_selector.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: tests that take longer or call remote data sources",
    "realdata: tests that require Tushare token and live data",
]
